name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run --extra mcp python -m unittest discover -s tests
      - name: Build ZIP
        run: uv run python scripts/build_release.py --name "apk-audit-${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "APK Audit $GITHUB_REF_NAME" \
            --notes "Tải file ZIP bên dưới, giải nén, mở thư mục installer và bấm đúp file cài theo máy (Windows / macOS / Linux). Xem README mục Cài đặt nhanh."
