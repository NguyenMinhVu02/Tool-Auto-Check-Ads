name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match pyproject version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME khác version $version trong pyproject.toml"; exit 1; }
      - name: Run tests
        run: uv run --extra mcp python -m unittest discover -s tests
      - name: Build ZIP
        run: uv run python scripts/build_release.py --name "apk-audit-${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --notes "Tải file ZIP bên dưới, giải nén, mở thư mục installer và bấm đúp file cài theo máy (Windows / macOS / Linux)."
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "APK Audit $GITHUB_REF_NAME" --latest "$@"
